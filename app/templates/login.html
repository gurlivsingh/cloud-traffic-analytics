{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="hero" style="grid-template-columns:1fr">
  <div>
    <p class="eyebrow">Admin</p>
    <h1>Log in to manage data.</h1>
  </div>
</div>
<section>
  <div class="card" style="max-width:440px">
    <form method="post">
      <p><label class="field">Password <input type="password" name="password" autofocus required></label></p>
      <button class="btn-clay">Log in</button>
    </form>
    {% if local_hint %}<p class="note">Local mode: the password is <code>admin</code>. On AWS it is stored as a hash in SSM Parameter Store.</p>{% endif %}
  </div>
</section>
{% endblock %}
